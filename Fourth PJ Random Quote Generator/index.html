<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
</head>
<body>
    <main>
        <div class="quote-div">
            <i class="fa-sharp fa-solid fa-quote-left left-quote"></i>
            <h3 id="quote-text">
                This Website can Generate random quotes.
            </h3>
            <i class="fa-solid fa-quote-right right-quote"></i>
        </div>
        <div class="author-div">
            <p class="author">By developer</p>
        </div>
        <hr>
        <div class="icons">
            <div >
                <i class="fa-solid fa-volume-high" id="voice"></i>
                <i class="fa-solid fa-clipboard" id="copy"></i>
                <i class="fa-brands fa-twitter" id="Twitter"></i>
            </div>
            <button class="btn load" >New Quote</button>
        </div>
        
    </main>
    <script src="script.js"></script>
</body>
</html>
